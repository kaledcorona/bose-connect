[package]
name = "bose-connect"
version = "0.1.0"
edition = "2024"
description = "A client for the RFCOMM control protocol used by Bose headphones"
license = "MIT"
repository = "https://github.com/kaledcorona/bose-connect"
keywords = ["bluetooth", "bose", "rfcomm", "headphones"]
categories = ["hardware-support"]

[[bin]]
name = "bose-connect"
path = "src/bin/bose-connect.rs"

[dependencies]
libc = "0.2.189"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[features]
mock = []
bluez = ["dep:zbus"]

# The binary's tests drive the fixtures; `cfg(test)` on the lib does not reach
# a bin target, so enable them through the feature.
[dev-dependencies]
bose-connect = { path = ".", features = ["mock"] }
